# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - wb_task: null


output_dir: "${oc.env:WBWAM_RUNS_ROOT,./runs}/train/${now:%Y-%m-%d}_${now:%H-%M-%S}"

# dataloading
batch_size: 2
num_workers: 4

# dataset sharding
shard_datasets_by_node: false
shard_group_size: 1

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
num_epochs: 1
max_steps: null
log_every: 10
save_every: 100
save_final: true
eval_every: 50
eval_at_start: false
eval_num_inference_steps: 10

# training
gradient_accumulation_steps: 1
mixed_precision: "bf16" # one of: [no, fp16, bf16]
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null

# wandb
wandb:
  enabled: false
  workspace: null
  project: wbwam
  name: train
  group: null
  mode: online

# Optional training dynamics metrics.
# Keep disabled by default because activation/attention stats add extra work on log steps.
training_dynamics:
  enabled: false
  activation:
    enabled: false
  grad:
    enabled: true
  optimizer:
    enabled: true
  weight:
    enabled: true

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
